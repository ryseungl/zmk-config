# Iris Custom left half — ESB 2.4GHz split peripheral (experimental, esb-test branch)
# Adapted from badjeff/zmk-config donki36_left.conf (working ESB sample).

CONFIG_ZMK_BATTERY_REPORTING=y

# Swap the split transport: BLE off, ESB on
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=1
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y

# ESB / stack sizing from the ESB module README + sample config
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_INPUT_THREAD_STACK_SIZE=8192
CONFIG_INPUT_QUEUE_MAX_MSGS=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
